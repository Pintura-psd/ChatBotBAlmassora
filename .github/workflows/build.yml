name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'PaginasReact/PaginasFront/package-lock.json'
    
    - name: Install dependencies
      run: npm install
      working-directory: PaginasReact/PaginasFront
    
    - name: Build frontend
      run: npm run build
      working-directory: PaginasReact/PaginasFront

  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'PaginasReact/PaginasFront/package-lock.json'
    
    - name: Build frontend
      run: npm run build
      working-directory: PaginasReact/PaginasFront
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -f demo/pom.xml -DskipTests
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USER_NAME: ${{ secrets.DB_USER_NAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    
    - name: Run Maven Tests
      run: mvn test -f demo/pom.xml
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USER_NAME: ${{ secrets.DB_USER_NAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    
    - name: Upload Backend Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: backend-war
        path: demo/target/*.war
