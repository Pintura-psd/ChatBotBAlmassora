# URL de conexi�n a PostgreSQL (con fallback a H2)
spring.datasource.url=${DB_URL}

# Usuario y contrase�a
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

# Configuraciones opcionales de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuraci�n de la aplicaci�n de Google
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
# Datos a obtener del usuario
spring.security.oauth2.client.registration.google.scope=email,profile


# logs de debuggeo
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG
#logging.level.com.tu.paquete=DEBUG

# Configuracion de servidor para Elastic Beanstalk
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/

# Recursos estáticos - permitir que Tomcat sirva correctamente
spring.resources.static-locations=classpath:/static/,classpath:/public/
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# Cache de recursos estáticos
spring.web.resources.cache.period=31536000s
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false

# CORS y seguridad
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600