# URL de conexiï¿½n a PostgreSQL (con fallback a H2)
spring.datasource.url=${DB_URL}

# Usuario y contraseï¿½a
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

# Configuraciones opcionales de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de la aplicación de Google
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
# Datos a obtener del usuario
spring.security.oauth2.client.registration.google.scope=email,profile


