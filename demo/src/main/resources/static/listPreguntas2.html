<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista preguntas</title>

    <!-- Bootstrap jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>


<div class="container">
    <h1 class="mb-4">Preguntas y respuestas</h1>


    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th class="w-75">Pregunta</th>
            <th class="w-25 text-end">Acciones</th>
        </tr>
        </thead>


        <tbody>
        <!-- Ejemplo estático: Replicar este bloque por cada pregunta -->
        <tr>
            <td class="fw-semibold align-top">
                 <p>Pregunta</p>


                <form class="mt-2">
<textarea
        id="respuesta-1"
        name="respuesta"
        class="form-control mb-2"
        rows="3"
        placeholder="Escribe tu respuesta..."
        required>

</textarea>
                </form>
            </td>


            <td class="text-end align-top">
                <div class="btn-group" role="group" aria-label="Acciones">
                    <button class="btn btn-success" type="button">Enviar</button>
                    <button class="btn btn-danger" type="button">Borrar</button>
                </div>
            </td>
        </tr>


        <!-- Copiar y pegar para más preguntas -->
        <tr>
            <td class="fw-semibold align-top">
                <label for="respuesta-2">¿Qué opinas del uso de IA en educación?</label>


                <form class="mt-2">
<textarea
        id="respuesta-2"
        name="respuesta"
        class="form-control mb-2"
        rows="3"
        placeholder="Escribe tu respuesta..."
        required></textarea>
                </form>
            </td>


            <td class="text-end align-top">
                <div class="btn-group" role="group" aria-label="Acciones">
                    <button class="btn btn-success" type="button">Enviar</button>
                    <button class="btn btn-danger" type="button">Borrar</button>
                </div>
            </td>
        </tr>


        </tbody>
    </table>
</div>

</body>
</html>
